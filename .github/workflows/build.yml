name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          echo "PROJ=$(dirname "$F")" >> $GITHUB_ENV
          echo "Project found in: $(dirname "$F")"

      - name: Build APK
        run: cd "$PROJ" && gradle assembleRelease --no-daemon

      - name: Copy APK
        run: cp "$PROJ"/app/build/outputs/apk/release/app-release.apk SpeedTest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedTest-APK
          path: SpeedTest.apk
